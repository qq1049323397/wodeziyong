<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <style>
    body{margin:0;padding:0;background:transparent;font-family:"Microsoft YaHei","PingFang SC",sans-serif}.dead-status-panel{width:320px;height:320px;box-sizing:border-box;border:1px solid rgba(160,120,255,.68);border-radius:14px;background:linear-gradient(145deg,rgba(35,28,48,.97),rgba(18,15,25,.97));color:#eee8ff;padding:12px;box-shadow:0 0 18px rgba(126,87,194,.36);overflow:hidden}.title{display:flex;justify-content:space-between;align-items:center;font-size:16px;font-weight:700;color:#f2ddff;margin-bottom:4px;text-shadow:0 0 8px rgba(205,135,255,.7)}.credit{font-size:12px;color:#ffd978;text-shadow:none;white-space:nowrap}.sub{font-size:11px;opacity:.78;margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tabs{display:flex;gap:4px;margin-bottom:8px}.tab{flex:1;height:28px;border-radius:8px;background:rgba(255,255,255,.08);color:#eee8ff;font-size:12px;border:1px solid rgba(255,255,255,.08);cursor:pointer;padding:0}.tab.active{background:linear-gradient(135deg,rgba(183,68,255,.8),rgba(104,54,200,.85));box-shadow:0 0 10px rgba(190,80,255,.55);font-weight:700}.content{height:226px;overflow:hidden;font-size:12px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:6px;margin-bottom:10px}.cell{height:31px;border-radius:8px;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-size:11px;border:1px solid rgba(255,255,255,.06)}.cell.current{background:rgba(202,75,255,.62);box-shadow:0 0 10px rgba(202,75,255,.8);font-weight:700}.line{line-height:1.72;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.label{opacity:.72}.items{padding-left:16px;margin:4px 0 0;line-height:1.7}.empty{opacity:.72;line-height:1.7}.rank-list{display:flex;flex-direction:column;gap:6px;margin-top:6px}.rank-row{display:grid;grid-template-columns:32px 1fr 72px;gap:6px;align-items:center;padding:6px 8px;border-radius:8px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.06)}.rank-row.player{background:rgba(202,75,255,.24);border-color:rgba(202,75,255,.42)}.dice-box{text-align:center;padding-top:10px}.dice-num{width:76px;height:76px;margin:10px auto;border-radius:18px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 0 18px rgba(255,255,255,.05),0 0 14px rgba(180,80,255,.22);display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:800;color:#fff0ff}.dice-btn{width:126px;height:34px;border:none;border-radius:999px;cursor:pointer;color:#fff;font-weight:700;background:linear-gradient(135deg,rgba(203,75,255,.95),rgba(112,70,210,.95));box-shadow:0 0 12px rgba(190,80,255,.42)}.dice-btn:disabled{opacity:.45;cursor:not-allowed;filter:grayscale(.2)}.dice-btn:active:not(:disabled){transform:scale(.98)}.notice{margin-top:10px;opacity:.72;font-size:11px;line-height:1.5}.archived{display:none!important}
  </style>
</head>
<body>
  <div class="dead-status-panel" data-dead-panel="true">
    <div class="title"><span>复活赛状态栏</span><span class="credit" data-role="credit">信用点 0</span></div>
    <div class="sub" data-role="subtitle">读取状态中...</div>
    <div class="tabs">
      <button class="tab active" data-tab="map">地图</button><button class="tab" data-tab="profile">档案</button><button class="tab" data-tab="items">持有</button><button class="tab" data-tab="rank">排行</button><button class="tab" data-tab="dice">骰子</button>
    </div>
    <div class="content" data-role="content"></div>
  </div>
<script>
(function(){
  const STORAGE_KEY="dead_revive_game_state_v1";
  const panel=document.currentScript.previousElementSibling;
  const panelId="dead-panel-"+Date.now()+"-"+Math.random().toString(16).slice(2);
  let currentTab="map";
  let submitted=false;
  panel.dataset.deadPanelId=panelId;
  panel.dataset.deadPanelTime=String(Date.now());

  const FALLBACK_STATE={玩家档案:{姓名:"未读取",年龄:"未读取",性别:"未读取",生前职业:"未读取",性格倾向:"未读取",死亡原因:"未读取",外貌特征:"未读取",背景故事:"未读取",遗愿执念:"未读取"},主角状态:{姓名:"未读取",身份:"复活赛参赛亡者",当前状态:"未读取状态",特殊能力:"等待生成",初始道具:"等待生成",状态效果:[]},资产:{信用点:0,排名:1},排行榜:[{名次:1,姓名:"未读取",信用点:0,标记:"玩家"}],复活赛:{阶段:"等待开局",当前回合:1,当前场景:"未读取状态",当前事件:"暂无",可投骰:false},地图:{名称:"地狱复活赛棋盘",当前位置:0,当前格子名称:"起点",当前格子类型:"起点",格子列表:[{index:0,name:"起点",type:"起点"},{index:1,name:"蓝",type:"事件"},{index:2,name:"黄",type:"地产"},{index:3,name:"红",type:"惩罚"},{index:4,name:"?",type:"未知"},{index:5,name:"蓝",type:"事件"},{index:6,name:"黄",type:"地产"},{index:7,name:"红",type:"惩罚"},{index:8,name:"店",type:"商店"},{index:9,name:"Boss",type:"Boss"}]},持有物:{信用点:0,道具:[],装备:[],关键物品:[]},骰子:{可掷骰:false,最近点数:null,最近时间:"",历史:[]}};
  function $(sel){return panel.querySelector(sel)}
  function escapeHtml(value){return String(value??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
  function getCandidates(){const list=[];try{list.push(window)}catch(e){}try{if(window.parent&&!list.includes(window.parent))list.push(window.parent)}catch(e){}try{if(window.top&&!list.includes(window.top))list.push(window.top)}catch(e){}return list}
  function getState(){for(const target of getCandidates()){try{if(target&&typeof target.DeadGetGameState==="function"){const state=target.DeadGetGameState();if(state)return state}}catch(e){}}try{const raw=localStorage.getItem(STORAGE_KEY);if(raw)return JSON.parse(raw)}catch(e){}return FALLBACK_STATE}
  function callRoll(){for(const target of getCandidates()){try{if(target&&typeof target.DeadRollDiceAndSubmit==="function")return target.DeadRollDiceAndSubmit();if(target&&typeof target.DeadRollDice==="function")return target.DeadRollDice()}catch(e){}}return{ok:false,message:"未找到 DeadRollDice，请确认开局自动化 v2.0 已启用。"}}
  function arrText(arr){if(!Array.isArray(arr)||arr.length===0)return"暂无";return arr.map(item=>typeof item==="string"?item:(item.name||item.名称||JSON.stringify(item))).join("、")}
  function enforceOnlyLatestPanel(){try{const panels=Array.from(document.querySelectorAll('.dead-status-panel[data-dead-panel="true"]'));if(panels.length<=1)return true;const latest=panels[panels.length-1];panels.forEach(p=>{if(p!==latest){p.classList.add('archived');p.dataset.archived="true"}else{p.classList.remove('archived');p.dataset.archived="false"}});return latest===panel}catch(e){return true}}
  function renderMap(state){const map=state.地图||FALLBACK_STATE.地图,race=state.复活赛||FALLBACK_STATE.复活赛,cells=map.格子列表||FALLBACK_STATE.地图.格子列表,pos=Number(map.当前位置||0);return `<div class="grid">${cells.map(cell=>`<div class="cell ${Number(cell.index)===pos?"current":""}">${escapeHtml(cell.name||cell.名称||cell.index)}</div>`).join("")}</div><div class="line"><span class="label">当前回合：</span>${escapeHtml(race.当前回合||1)}</div><div class="line"><span class="label">当前位置：</span>${escapeHtml(map.当前格子名称||"起点")} / ${escapeHtml(map.当前格子类型||"起点")}</div><div class="line"><span class="label">当前阶段：</span>${escapeHtml(race.阶段||"未知")}</div><div class="line"><span class="label">当前事件：</span>${escapeHtml(race.当前事件||"暂无")}</div>`}
  function renderProfile(state){const p=state.玩家档案||FALLBACK_STATE.玩家档案,s=state.主角状态||FALLBACK_STATE.主角状态;return `<div class="line"><span class="label">姓名：</span>${escapeHtml(p.姓名)}</div><div class="line"><span class="label">年龄：</span>${escapeHtml(p.年龄)}</div><div class="line"><span class="label">性别：</span>${escapeHtml(p.性别)}</div><div class="line"><span class="label">生前职业：</span>${escapeHtml(p.生前职业)}</div><div class="line"><span class="label">死亡原因：</span>${escapeHtml(p.死亡原因)}</div><div class="line"><span class="label">当前状态：</span>${escapeHtml(s.当前状态)}</div><div class="line"><span class="label">特殊能力：</span>${escapeHtml(s.特殊能力)}</div><div class="line"><span class="label">初始道具：</span>${escapeHtml(s.初始道具)}</div>`}
  function renderItems(state){const items=state.持有物||FALLBACK_STATE.持有物,asset=state.资产||FALLBACK_STATE.资产;return `<div class="line"><span class="label">信用点：</span>${escapeHtml(asset.信用点??items.信用点??0)}</div><div class="line"><span class="label">道具：</span></div><ul class="items">${(items.道具&&items.道具.length)?items.道具.map(x=>`<li>${escapeHtml(typeof x==="string"?x:(x.name||x.名称||"未命名道具"))}</li>`).join(""):`<li class="empty">暂无</li>`}</ul><div class="line"><span class="label">装备：</span>${escapeHtml(arrText(items.装备))}</div><div class="line"><span class="label">关键物品：</span>${escapeHtml(arrText(items.关键物品))}</div>`}
  function renderRank(state){const rank=Array.isArray(state.排行榜)?state.排行榜:FALLBACK_STATE.排行榜;return `<div class="rank-list">${rank.map(row=>`<div class="rank-row ${row.标记==="玩家"?"player":""}"><div>#${escapeHtml(row.名次)}</div><div>${escapeHtml(row.姓名)}</div><div>${escapeHtml(row.信用点||0)} 点</div></div>`).join("")}</div>`}
  function renderDice(state){const dice=state.骰子||FALLBACK_STATE.骰子,race=state.复活赛||FALLBACK_STATE.复活赛,point=dice.最近点数===null||dice.最近点数===undefined?"?":dice.最近点数,canRoll=dice.可掷骰!==false&&race.可投骰!==false&&!submitted;return `<div class="dice-box"><div class="line"><span class="label">阶段：</span>${escapeHtml(race.阶段||"未知")}</div><div class="dice-num">${escapeHtml(point)}</div><button class="dice-btn" data-role="roll" ${canRoll?"":"disabled"}>${submitted?"已提交":"掷骰"}</button><div class="notice">点击后会自动提交给 AI 结算格子事件。<br>最近时间：${escapeHtml(dice.最近时间||"暂无")}</div></div>`}
  function render(){const isLatest=enforceOnlyLatestPanel();if(!isLatest)return;const state=getState(),profile=state.玩家档案||FALLBACK_STATE.玩家档案,race=state.复活赛||FALLBACK_STATE.复活赛,map=state.地图||FALLBACK_STATE.地图,asset=state.资产||FALLBACK_STATE.资产;$("[data-role='subtitle']").textContent=`${profile.姓名||"未读取"} · ${race.阶段||"未知"} · ${map.当前格子名称||"起点"}`;$("[data-role='credit']").textContent=`信用点 ${asset.信用点??0}`;const content=$("[data-role='content']");if(currentTab==="map")content.innerHTML=renderMap(state);if(currentTab==="profile")content.innerHTML=renderProfile(state);if(currentTab==="items")content.innerHTML=renderItems(state);if(currentTab==="rank")content.innerHTML=renderRank(state);if(currentTab==="dice"){content.innerHTML=renderDice(state);const btn=$("[data-role='roll']");if(btn)btn.onclick=()=>{const result=callRoll();if(!result||!result.ok){alert(result?.message||"掷骰失败");return}submitted=true;render()}}}
  panel.querySelectorAll(".tab").forEach(btn=>{btn.addEventListener("click",()=>{panel.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));btn.classList.add("active");currentTab=btn.dataset.tab;render()})});
  render();setInterval(render,1000);
})();
</script>
</body>
</html>
