<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <style>
    :root {
      --panel-w: 420px;
      --panel-h: 420px;
      --bg-1: rgba(28, 20, 42, 0.98);
      --bg-2: rgba(12, 10, 20, 0.98);
      --line: rgba(210, 170, 255, 0.28);
      --line-strong: rgba(215, 145, 255, 0.66);
      --text: #f2ecff;
      --muted: rgba(242, 236, 255, 0.68);
      --gold: #ffd978;
      --purple: #c65cff;
      --purple-dark: #6f45dd;
      --danger: #ff6b8b;
      --blue: #68b7ff;
      --yellow: #ffd978;
      --red: #ff6b75;
      --green: #75ffbb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: transparent;
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    }

    .dead-status-panel {
      width: var(--panel-w);
      height: var(--panel-h);
      position: relative;
      color: var(--text);
      border: 1px solid var(--line-strong);
      border-radius: 22px;
      padding: 14px;
      overflow: hidden;
      background:
        radial-gradient(circle at 18% 0%, rgba(203, 89, 255, 0.28), transparent 36%),
        radial-gradient(circle at 85% 12%, rgba(255, 210, 120, 0.14), transparent 30%),
        radial-gradient(circle at 50% 100%, rgba(92, 62, 185, 0.28), transparent 42%),
        linear-gradient(145deg, var(--bg-1), var(--bg-2));
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.05) inset,
        0 0 28px rgba(150, 70, 255, 0.33),
        0 16px 42px rgba(0,0,0,0.34);
    }

    .dead-status-panel::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.028) 1px, transparent 1px);
      background-size: 18px 18px;
      opacity: 0.36;
      mask-image: linear-gradient(to bottom, black, transparent 88%);
    }

    .dead-status-panel::after {
      content: "";
      position: absolute;
      inset: 1px;
      pointer-events: none;
      border-radius: 21px;
      border: 1px solid rgba(255,255,255,0.06);
    }

    .archived {
      display: none !important;
    }

    .top {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .title-wrap {
      min-width: 0;
    }

    .title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 0.8px;
      color: #f9eaff;
      text-shadow: 0 0 10px rgba(205, 105, 255, 0.82);
      line-height: 1.15;
    }

    .title-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--purple);
      box-shadow: 0 0 12px var(--purple);
      flex: 0 0 auto;
    }

    .sub {
      margin-top: 5px;
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 270px;
    }

    .credit-card {
      min-width: 96px;
      padding: 8px 10px;
      border-radius: 14px;
      background: rgba(255, 217, 120, 0.12);
      border: 1px solid rgba(255, 217, 120, 0.28);
      text-align: right;
      box-shadow: 0 0 16px rgba(255, 217, 120, 0.12) inset;
    }

    .credit-label {
      font-size: 10px;
      color: rgba(255, 217, 120, 0.72);
      line-height: 1;
    }

    .credit {
      margin-top: 3px;
      font-size: 15px;
      color: var(--gold);
      font-weight: 900;
      white-space: nowrap;
    }

    .tabs {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      margin-bottom: 10px;
      padding: 5px;
      border-radius: 16px;
      background: rgba(0,0,0,0.18);
      border: 1px solid rgba(255,255,255,0.06);
    }

    .tab {
      height: 32px;
      border-radius: 12px;
      border: 1px solid transparent;
      background: rgba(255,255,255,0.06);
      color: rgba(242,236,255,0.78);
      font-size: 13px;
      cursor: pointer;
      padding: 0;
      transition: 0.16s ease;
    }

    .tab:hover {
      color: #fff;
      background: rgba(255,255,255,0.1);
    }

    .tab.active {
      color: #fff;
      font-weight: 900;
      background: linear-gradient(135deg, rgba(207, 83, 255, 0.92), rgba(105, 65, 220, 0.94));
      border-color: rgba(255,255,255,0.2);
      box-shadow:
        0 0 16px rgba(196, 82, 255, 0.52),
        0 0 0 1px rgba(255,255,255,0.08) inset;
    }

    .content {
      position: relative;
      z-index: 1;
      height: 304px;
      overflow: hidden;
      font-size: 13px;
    }

    .section {
      height: 100%;
      overflow: auto;
      padding-right: 4px;
    }

    .section::-webkit-scrollbar {
      width: 5px;
    }

    .section::-webkit-scrollbar-thumb {
      background: rgba(210, 145, 255, 0.35);
      border-radius: 999px;
    }

    .glass {
      background: rgba(255,255,255,0.065);
      border: 1px solid rgba(255,255,255,0.085);
      border-radius: 16px;
      padding: 10px;
      margin-bottom: 8px;
      box-shadow: 0 0 14px rgba(0,0,0,0.12) inset;
    }

    .line {
      line-height: 1.75;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .label {
      color: var(--muted);
    }

    .value {
      color: var(--text);
      font-weight: 650;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }

    .cell {
      height: 43px;
      border-radius: 14px;
      background: rgba(255,255,255,0.07);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 2px;
      font-size: 12px;
      border: 1px solid rgba(255,255,255,0.075);
      position: relative;
      overflow: hidden;
    }

    .cell::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0.12;
    }

    .cell.event::before {
      background: var(--blue);
    }

    .cell.land::before {
      background: var(--yellow);
    }

    .cell.punish::before {
      background: var(--red);
    }

    .cell.shop::before {
      background: var(--green);
    }

    .cell.boss::before {
      background: var(--danger);
    }

    .cell-name {
      position: relative;
      z-index: 1;
      font-weight: 900;
      line-height: 1;
    }

    .cell-type {
      position: relative;
      z-index: 1;
      font-size: 9px;
      color: rgba(255,255,255,0.62);
      line-height: 1;
    }

    .cell.current {
      background: rgba(202,75,255,0.62);
      border-color: rgba(255,230,255,0.52);
      box-shadow:
        0 0 18px rgba(202,75,255,0.82),
        0 0 0 1px rgba(255,255,255,0.12) inset;
      transform: translateY(-1px);
    }

    .cell.current .cell-name {
      color: #fff;
      text-shadow: 0 0 8px rgba(255,255,255,0.6);
    }

    .pill-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 6px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(255,255,255,0.075);
      border: 1px solid rgba(255,255,255,0.08);
      color: rgba(242,236,255,0.86);
      font-size: 12px;
    }

    .ability-box {
      border-color: rgba(202, 92, 255, 0.26);
      background: rgba(202, 92, 255, 0.09);
    }

    .item-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 6px;
    }

    .item {
      padding: 8px 9px;
      border-radius: 12px;
      background: rgba(255,255,255,0.065);
      border: 1px solid rgba(255,255,255,0.075);
      line-height: 1.45;
    }

    .empty {
      color: var(--muted);
      line-height: 1.7;
    }

    .rank-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .rank-row {
      display: grid;
      grid-template-columns: 42px 1fr 82px;
      gap: 8px;
      align-items: center;
      padding: 9px 10px;
      border-radius: 14px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.075);
    }

    .rank-row.player {
      background: linear-gradient(135deg, rgba(202,75,255,0.27), rgba(255,217,120,0.1));
      border-color: rgba(202,75,255,0.45);
      box-shadow: 0 0 16px rgba(202,75,255,0.18);
    }

    .rank-no {
      color: var(--gold);
      font-weight: 900;
    }

    .rank-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 750;
    }

    .rank-credit {
      text-align: right;
      color: var(--gold);
      font-weight: 850;
    }

    .dice-box {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 10px;
    }

    .dice-phase {
      max-width: 100%;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .dice-num {
      width: 108px;
      height: 108px;
      border-radius: 26px;
      background:
        radial-gradient(circle at 25% 20%, rgba(255,255,255,0.24), transparent 28%),
        linear-gradient(145deg, rgba(255,255,255,0.13), rgba(255,255,255,0.045));
      border: 1px solid rgba(255,255,255,0.18);
      box-shadow:
        inset 0 0 28px rgba(255,255,255,0.05),
        0 0 22px rgba(180,80,255,0.34);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      font-weight: 950;
      color: #fff0ff;
      text-shadow: 0 0 14px rgba(255,255,255,0.48);
    }

    .dice-btn {
      width: 154px;
      height: 42px;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      color: #fff;
      font-weight: 900;
      font-size: 15px;
      background: linear-gradient(135deg, rgba(214, 78, 255, .98), rgba(112, 70, 210, .98));
      box-shadow:
        0 0 16px rgba(190,80,255,.46),
        0 0 0 1px rgba(255,255,255,0.1) inset;
    }

    .dice-btn:disabled {
      opacity: .48;
      cursor: not-allowed;
      filter: grayscale(.25);
    }

    .dice-btn:active:not(:disabled) {
      transform: scale(.98);
    }

    .notice {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
      max-width: 310px;
    }

    .error {
      color: #ffd1dc;
      background: rgba(255, 107, 139, 0.12);
      border: 1px solid rgba(255, 107, 139, 0.28);
      border-radius: 14px;
      padding: 10px;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <div class="dead-status-panel" data-dead-panel="true">
    <div class="top">
      <div class="title-wrap">
        <div class="title"><span class="title-dot"></span><span>复活赛状态栏</span></div>
        <div class="sub" data-role="subtitle">读取状态中...</div>
      </div>
      <div class="credit-card">
        <div class="credit-label">CREDIT</div>
        <div class="credit" data-role="credit">0 点</div>
      </div>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="map">地图</button>
      <button class="tab" data-tab="profile">档案</button>
      <button class="tab" data-tab="items">持有</button>
      <button class="tab" data-tab="rank">排行</button>
      <button class="tab" data-tab="dice">骰子</button>
    </div>

    <div class="content" data-role="content"></div>
  </div>

<script>
(function(){
  const STORAGE_KEY = "dead_revive_game_state_v1";

  function getCurrentPanel() {
    try {
      const panels = Array.from(document.querySelectorAll('.dead-status-panel[data-dead-panel="true"]'));
      return panels[panels.length - 1] || null;
    } catch (e) {
      return null;
    }
  }

  const panel = getCurrentPanel();
  if (!panel) return;

  const panelId = "dead-panel-" + Date.now() + "-" + Math.random().toString(16).slice(2);
  let currentTab = "map";
  let submitted = false;

  panel.dataset.deadPanelId = panelId;
  panel.dataset.deadPanelTime = String(Date.now());

  const FALLBACK_STATE = {
    玩家档案: {
      姓名: "未读取",
      年龄: "未读取",
      性别: "未读取",
      生前职业: "未读取",
      性格倾向: "未读取",
      死亡原因: "未读取",
      外貌特征: "未读取",
      背景故事: "未读取",
      遗愿执念: "未读取"
    },
    主角状态: {
      姓名: "未读取",
      身份: "复活赛参赛亡者",
      当前状态: "未读取状态",
      特殊能力: "等待生成",
      初始道具: "等待生成",
      状态效果: []
    },
    资产: {
      信用点: 0,
      排名: 1
    },
    排行榜: [
      { 名次: 1, 姓名: "未读取", 信用点: 0, 标记: "玩家" }
    ],
    复活赛: {
      阶段: "等待开局",
      当前回合: 1,
      当前场景: "未读取状态",
      当前事件: "暂无",
      可投骰: false
    },
    地图: {
      名称: "地狱复活赛棋盘",
      当前位置: 0,
      当前格子名称: "起点",
      当前格子类型: "起点",
      格子列表: [
        { index: 0, name: "起点", type: "起点" },
        { index: 1, name: "蓝", type: "事件" },
        { index: 2, name: "黄", type: "地产" },
        { index: 3, name: "红", type: "惩罚" },
        { index: 4, name: "?", type: "未知" },
        { index: 5, name: "蓝", type: "事件" },
        { index: 6, name: "黄", type: "地产" },
        { index: 7, name: "红", type: "惩罚" },
        { index: 8, name: "店", type: "商店" },
        { index: 9, name: "Boss", type: "Boss" }
      ]
    },
    持有物: {
      信用点: 0,
      道具: [],
      装备: [],
      关键物品: []
    },
    骰子: {
      可掷骰: false,
      最近点数: null,
      最近移动: null,
      最近时间: "",
      历史: []
    }
  };

  function $(sel) {
    return panel.querySelector(sel);
  }

  function escapeHtml(value) {
    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function getCandidates() {
    const list = [];

    try { list.push(window); } catch (e) {}

    try {
      if (window.parent && !list.includes(window.parent)) list.push(window.parent);
    } catch (e) {}

    try {
      if (window.top && !list.includes(window.top)) list.push(window.top);
    } catch (e) {}

    return list;
  }

  function readLocalStorageFromTargets() {
    for (const target of getCandidates()) {
      try {
        const raw = target.localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const state = JSON.parse(raw);
          if (state && typeof state === "object") return state;
        }
      } catch (e) {}
    }

    return null;
  }

  function getState() {
    for (const target of getCandidates()) {
      try {
        if (target && typeof target.DeadGetGameState === "function") {
          const state = target.DeadGetGameState();
          if (state && typeof state === "object") return state;
        }
      } catch (e) {}
    }

    const fromStorage = readLocalStorageFromTargets();
    if (fromStorage) return fromStorage;

    return FALLBACK_STATE;
  }

  function callRoll() {
    for (const target of getCandidates()) {
      try {
        if (target && typeof target.DeadRollDiceAndSubmit === "function") {
          return target.DeadRollDiceAndSubmit();
        }
        if (target && typeof target.DeadRollDice === "function") {
          return target.DeadRollDice();
        }
      } catch (e) {}
    }

    return {
      ok: false,
      message: "未找到 DeadRollDice，请确认开局自动化脚本已启用。"
    };
  }

  function arrText(arr) {
    if (!Array.isArray(arr) || arr.length === 0) return "暂无";

    return arr.map(item => {
      if (typeof item === "string") return item;
      return item.name || item.名称 || JSON.stringify(item);
    }).join("、");
  }

  function listItems(arr) {
    if (!Array.isArray(arr) || arr.length === 0) {
      return `<div class="empty">暂无</div>`;
    }

    return `<div class="item-list">${
      arr.map(item => {
        const text = typeof item === "string" ? item : (item.name || item.名称 || JSON.stringify(item));
        return `<div class="item">${escapeHtml(text)}</div>`;
      }).join("")
    }</div>`;
  }

  function cellClass(type) {
    const t = String(type || "");
    if (t.includes("事件") || t.includes("蓝")) return "event";
    if (t.includes("地产") || t.includes("黄")) return "land";
    if (t.includes("惩罚") || t.includes("红")) return "punish";
    if (t.includes("商店") || t.includes("店")) return "shop";
    if (t.includes("Boss") || t.includes("boss")) return "boss";
    return "";
  }

  function enforceOnlyLatestPanel() {
    try {
      const panels = Array.from(document.querySelectorAll('.dead-status-panel[data-dead-panel="true"]'));
      if (panels.length <= 1) return true;

      const latest = panels[panels.length - 1];

      panels.forEach(p => {
        if (p !== latest) {
          p.classList.add("archived");
          p.dataset.archived = "true";
        } else {
          p.classList.remove("archived");
          p.dataset.archived = "false";
        }
      });

      return latest === panel;
    } catch (e) {
      return true;
    }
  }

  function renderMap(state) {
    const map = state.地图 || FALLBACK_STATE.地图;
    const race = state.复活赛 || FALLBACK_STATE.复活赛;
    const cells = Array.isArray(map.格子列表) ? map.格子列表 : FALLBACK_STATE.地图.格子列表;
    const pos = Number(map.当前位置 || 0);

    return `
      <div class="section">
        <div class="grid">
          ${cells.map(cell => {
            const name = cell.name || cell.名称 || cell.index;
            const type = cell.type || cell.类型 || "";
            return `
              <div class="cell ${cellClass(type)} ${Number(cell.index) === pos ? "current" : ""}">
                <div class="cell-name">${escapeHtml(name)}</div>
                <div class="cell-type">${escapeHtml(type)}</div>
              </div>
            `;
          }).join("")}
        </div>

        <div class="glass">
          <div class="line"><span class="label">当前回合：</span><span class="value">${escapeHtml(race.当前回合 || 1)}</span></div>
          <div class="line"><span class="label">当前位置：</span><span class="value">${escapeHtml(map.当前位置 ?? 0)} · ${escapeHtml(map.当前格子名称 || "起点")} / ${escapeHtml(map.当前格子类型 || "起点")}</span></div>
          <div class="line"><span class="label">当前阶段：</span><span class="value">${escapeHtml(race.阶段 || "未知")}</span></div>
          <div class="line"><span class="label">当前事件：</span><span class="value">${escapeHtml(race.当前事件 || "暂无")}</span></div>
        </div>
      </div>
    `;
  }

  function renderProfile(state) {
    const p = state.玩家档案 || FALLBACK_STATE.玩家档案;
    const s = state.主角状态 || FALLBACK_STATE.主角状态;

    return `
      <div class="section">
        <div class="glass">
          <div class="line"><span class="label">姓名：</span><span class="value">${escapeHtml(p.姓名)}</span></div>
          <div class="line"><span class="label">年龄：</span><span class="value">${escapeHtml(p.年龄)}</span></div>
          <div class="line"><span class="label">性别：</span><span class="value">${escapeHtml(p.性别)}</span></div>
          <div class="line"><span class="label">生前职业：</span><span class="value">${escapeHtml(p.生前职业)}</span></div>
          <div class="line"><span class="label">性格倾向：</span><span class="value">${escapeHtml(p.性格倾向)}</span></div>
          <div class="line"><span class="label">死亡原因：</span><span class="value">${escapeHtml(p.死亡原因)}</span></div>
        </div>

        <div class="glass ability-box">
          <div class="line"><span class="label">当前状态：</span><span class="value">${escapeHtml(s.当前状态)}</span></div>
          <div class="line"><span class="label">特殊能力：</span><span class="value">${escapeHtml(s.特殊能力)}</span></div>
          <div class="line"><span class="label">初始道具：</span><span class="value">${escapeHtml(s.初始道具)}</span></div>
          <div class="line"><span class="label">状态效果：</span><span class="value">${escapeHtml(arrText(s.状态效果))}</span></div>
        </div>

        <div class="pill-row">
          <span class="pill">背景：${escapeHtml(p.背景故事 || "暂无")}</span>
          <span class="pill">执念：${escapeHtml(p.遗愿执念 || "暂无")}</span>
        </div>
      </div>
    `;
  }

  function renderItems(state) {
    const items = state.持有物 || FALLBACK_STATE.持有物;
    const asset = state.资产 || FALLBACK_STATE.资产;
    const s = state.主角状态 || FALLBACK_STATE.主角状态;

    const mergedTools = Array.isArray(items.道具) ? [...items.道具] : [];
    if (s.初始道具 && s.初始道具 !== "等待生成" && !mergedTools.includes(s.初始道具)) {
      mergedTools.unshift(s.初始道具);
    }

    return `
      <div class="section">
        <div class="glass">
          <div class="line"><span class="label">信用点：</span><span class="value">${escapeHtml(asset.信用点 ?? items.信用点 ?? 0)}</span></div>
          <div class="line"><span class="label">当前排名：</span><span class="value">#${escapeHtml(asset.排名 ?? 1)}</span></div>
        </div>

        <div class="glass">
          <div class="line"><span class="label">道具：</span></div>
          ${listItems(mergedTools)}
        </div>

        <div class="glass">
          <div class="line"><span class="label">装备：</span><span class="value">${escapeHtml(arrText(items.装备))}</span></div>
          <div class="line"><span class="label">关键物品：</span><span class="value">${escapeHtml(arrText(items.关键物品))}</span></div>
        </div>
      </div>
    `;
  }

  function renderRank(state) {
    const rank = Array.isArray(state.排行榜) ? state.排行榜 : FALLBACK_STATE.排行榜;

    return `
      <div class="section">
        <div class="rank-list">
          ${rank.map(row => `
            <div class="rank-row ${row.标记 === "玩家" ? "player" : ""}">
              <div class="rank-no">#${escapeHtml(row.名次)}</div>
              <div class="rank-name">${escapeHtml(row.姓名)}</div>
              <div class="rank-credit">${escapeHtml(row.信用点 || 0)} 点</div>
            </div>
          `).join("")}
        </div>
      </div>
    `;
  }

  function renderDice(state) {
    const dice = state.骰子 || FALLBACK_STATE.骰子;
    const race = state.复活赛 || FALLBACK_STATE.复活赛;

    const point = dice.最近点数 === null || dice.最近点数 === undefined ? "?" : dice.最近点数;
    const canRoll = dice.可掷骰 !== false && race.可投骰 !== false && !submitted;

    return `
      <div class="section">
        <div class="dice-box">
          <div class="dice-phase">${escapeHtml(race.阶段 || "未知")}</div>
          <div class="dice-num">${escapeHtml(point)}</div>
          <button class="dice-btn" data-role="roll" ${canRoll ? "" : "disabled"}>${submitted ? "已提交" : "掷骰"}</button>
          <div class="notice">
            点击后会自动提交给 AI 结算格子事件。<br>
            最近移动：${escapeHtml(dice.最近移动 ?? "暂无")}　最近时间：${escapeHtml(dice.最近时间 || "暂无")}
          </div>
        </div>
      </div>
    `;
  }

  function render() {
    const isLatest = enforceOnlyLatestPanel();
    if (!isLatest) return;

    const state = getState();
    const profile = state.玩家档案 || FALLBACK_STATE.玩家档案;
    const race = state.复活赛 || FALLBACK_STATE.复活赛;
    const map = state.地图 || FALLBACK_STATE.地图;
    const asset = state.资产 || FALLBACK_STATE.资产;

    const subtitle = $("[data-role='subtitle']");
    const credit = $("[data-role='credit']");
    const content = $("[data-role='content']");

    if (!subtitle || !credit || !content) return;

    subtitle.textContent = `${profile.姓名 || "未读取"} · ${race.阶段 || "未知"} · ${map.当前格子名称 || "起点"}`;
    credit.textContent = `${asset.信用点 ?? 0} 点`;

    if (currentTab === "map") content.innerHTML = renderMap(state);
    if (currentTab === "profile") content.innerHTML = renderProfile(state);
    if (currentTab === "items") content.innerHTML = renderItems(state);
    if (currentTab === "rank") content.innerHTML = renderRank(state);

    if (currentTab === "dice") {
      content.innerHTML = renderDice(state);

      const btn = $("[data-role='roll']");
      if (btn) {
        btn.onclick = () => {
          const result = callRoll();

          if (!result || !result.ok) {
            alert(result?.message || "掷骰失败");
            return;
          }

          submitted = true;
          render();
        };
      }
    }
  }

  panel.querySelectorAll(".tab").forEach(btn => {
    btn.addEventListener("click", () => {
      panel.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
      btn.classList.add("active");
      currentTab = btn.dataset.tab;
      render();
    });
  });

  render();
  setInterval(render, 1000);
})();
</script>
</body>
</html>
